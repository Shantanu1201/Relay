<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riddle Relay Brain Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050B14;--fg:#F2F7FB;--mut:#8FA6BD;--line:#2B3B55;--c1:#22D3EE;--c2:#7CFF3A;--c3:#F2B33D;--c4:#FF5C8A;--card:#0B1626;--on:#050B14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F4F8FB;--fg:#0B1626;--mut:#4A6580;--line:#C5D3E0;--c1:#0A7F92;--c2:#2A7A10;--c3:#A86B00;--c4:#B82A59;--card:#FFFFFF;--on:#FFFFFF}}
:root[data-theme="light"]{--bg:#F4F8FB;--fg:#0B1626;--mut:#4A6580;--line:#C5D3E0;--c1:#0A7F92;--c2:#2A7A10;--c3:#A86B00;--c4:#B82A59;--card:#FFFFFF;--on:#FFFFFF}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',monospace}
#app{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;margin:0}
h1{font-size:34px;line-height:1}
h1 span{color:var(--c1)}
p{color:var(--mut);line-height:1.5;font-size:14px}
button,input{font:inherit;color:var(--fg)}
.btn{display:block;width:100%;min-height:48px;margin:10px 0;padding:12px 14px;text-align:left;background:var(--card);border:2px solid var(--c1);border-radius:14px;cursor:pointer}
.btn b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:20px}
.btn small{color:var(--mut)}
.pri{background:var(--c1);color:var(--on);text-align:center;font-weight:500}
input{width:100%;box-sizing:border-box;min-height:48px;padding:10px 14px;background:var(--card);border:2px solid var(--line);border-radius:12px;font-size:18px}
.grid{display:grid;gap:8px;margin:16px 0}
.cell{aspect-ratio:1;border:2px solid var(--c1);border-radius:12px;background:var(--card);font-size:28px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cell.on{background:var(--c2);color:var(--on);border-color:var(--c2)}
.cell.blank{visibility:hidden}
.pad{aspect-ratio:1;border:0;border-radius:16px;opacity:.4;cursor:pointer}
.pad.f{opacity:1;box-shadow:0 0 28px currentColor}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lnk{background:none;border:0;color:var(--c1);cursor:pointer;text-decoration:underline;min-height:44px}
.hist{margin:10px 0;padding:0;list-style:none}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
.ok{border:2px solid var(--c2);border-radius:18px;padding:22px;text-align:center}
.ok h2{font-size:48px;color:var(--c2)}
.ok div{margin:8px 0;font-size:18px}
.st{min-height:24px;color:var(--c3);margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
let team='',t0=0,cur='';
try{team=sessionStorage.getItem('team')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.random()*n|0;
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const G={
 slide:['Slide Eight','Slide the tiles into order 1 to 8.'],
 lights:['Lights Out','Switch every light off. A tap flips the tile and its neighbours.'],
 code:['Code Breaker','Find the secret 4-digit code. All digits differ.'],
 memory:['Memory Pairs','Match all 8 pairs.'],
 echo:['Echo','Repeat the flashing pattern. Reach 7 steps.']
};
function home(){
 cur='';
 app.innerHTML='<h1>Riddle<br>Relay <span>2.0</span></h1><p>Brain games. Enter your team number, pick the game you were given, solve it, and show the SOLVED screen to the marshal.</p><label for="tn">Team number</label><input id="tn" inputmode="numeric" maxlength="3" value="'+esc(team)+'">'+Object.keys(G).map(k=>'<button class="btn" data-g="'+k+'"><b>'+G[k][0]+'</b><small>'+G[k][1]+'</small></button>').join('');
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>begin(b.dataset.g));
}
function begin(g){
 const v=document.getElementById('tn')?document.getElementById('tn').value.trim():team;
 if(!/^\d{1,3}$/.test(v)){document.getElementById('tn').focus();return}
 team=v;try{sessionStorage.setItem('team',v)}catch(e){}
 cur=g;t0=Date.now();
 app.innerHTML='<div class="bar"><h2>'+G[g][0]+'</h2><button class="lnk" id="bk">menu</button></div><p>'+G[g][1]+'</p><div id="box"></div>';
 document.getElementById('bk').onclick=home;
 window[g](document.getElementById('box'));
}
function win(info){
 const d=new Date(),s=Math.round((Date.now()-t0)/1000);
 app.innerHTML='<div class="ok"><h2>SOLVED</h2><div>'+esc(G[cur][0])+'</div><div>Team '+esc(team)+'</div><div>'+d.toLocaleTimeString()+'</div><div>'+s+' seconds, '+esc(info)+'</div></div><p>Show this screen to the marshal. A screenshot is not accepted.</p><button class="btn pri" id="hm">Back to menu</button>';
 document.getElementById('hm').onclick=home;
}
function nbr(i){const r=i/3|0,c=i%3,o=[];if(r>0)o.push(i-3);if(r<2)o.push(i+3);if(c>0)o.push(i-1);if(c<2)o.push(i+1);return o}
function slide(box){
 let b=[1,2,3,4,5,6,7,8,0],mv=0,last=-1;
 do{for(let i=0;i<100;i++){const z=b.indexOf(0),n=nbr(z).filter(x=>x!==last),k=n[rnd(n.length)];b[z]=b[k];b[k]=0;last=z}}while(b.join()==='1,2,3,4,5,6,7,8,0');
 const draw=()=>{box.innerHTML='<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+b.map((v,i)=>'<button class="cell'+(v?'':' blank')+'" data-i="'+i+'">'+v+'</button>').join('')+'</div><p>Moves: '+mv+'</p>';
  box.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{const i=+c.dataset.i,z=b.indexOf(0);if(nbr(z).includes(i)){b[z]=b[i];b[i]=0;mv++;if(b.join()==='1,2,3,4,5,6,7,8,0')win(mv+' moves');else draw()}})};
 draw();
}
function lights(box){
 let L,mv=0;
 const tog=(a,i)=>{const r=i/3|0,c=i%3;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y])=>{const R=r+x,C=c+y;if(R>=0&&R<3&&C>=0&&C<3)a[R*3+C]^=1})};
 do{L=Array(9).fill(0);for(let i=0;i<9;i++)if(Math.random()<.5)tog(L,i)}while(!L.some(x=>x));
 const draw=()=>{box.innerHTML='<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+L.map((v,i)=>'<button class="cell'+(v?' on':'')+'" data-i="'+i+'" aria-label="light '+(i+1)+(v?' on':' off')+'"></button>').join('')+'</div><p>Taps: '+mv+'</p>';
  box.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{tog(L,+c.dataset.i);mv++;if(L.some(x=>x))draw();else win(mv+' taps')})};
 draw();
}
function code(box){
 let sec=shuf([...'0123456789']).slice(0,4).join(''),h=[];
 const draw=(m)=>{box.innerHTML='<input id="gi" inputmode="numeric" maxlength="4" placeholder="4 different digits"><button class="btn pri" id="go">Guess ('+(10-h.length)+' left)</button><div class="st">'+(m||'')+'</div><ul class="hist">'+h.map(x=>'<li>'+x[0]+' &nbsp; '+x[1]+' in place, '+x[2]+' in wrong place</li>').join('')+'</ul>';
  document.getElementById('go').onclick=()=>{const g=document.getElementById('gi').value.trim();
   if(!/^\d{4}$/.test(g)||new Set(g).size<4){draw('Enter 4 different digits.');return}
   let bu=0,co=0;for(let i=0;i<4;i++){if(g[i]===sec[i])bu++;else if(sec.includes(g[i]))co++}
   h.unshift([g,bu,co]);
   if(bu===4){win((h.length)+' guesses');return}
   if(h.length>=10){sec=shuf([...'0123456789']).slice(0,4).join('');h=[];draw('Out of guesses. A new code was set.');return}
   draw()}};
 draw();
}
function memory(box){
 const S=['▲','●','■','◆','★','✚','♥','♣'],c=shuf([...S,...S]);let open=[],ok=new Set(),lock=0,mv=0;
 const draw=()=>{box.innerHTML='<div class="grid" style="grid-template-columns:repeat(4,1fr)">'+c.map((v,i)=>'<button class="cell'+(ok.has(i)?' on':'')+'" data-i="'+i+'">'+((open.includes(i)||ok.has(i))?v:'?')+'</button>').join('')+'</div><p>Tries: '+mv+'</p>';
  box.querySelectorAll('.cell').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(lock||open.includes(i)||ok.has(i))return;open.push(i);
   if(open.length===2){mv++;const[a,b]=open;if(c[a]===c[b]){ok.add(a);ok.add(b);open=[];if(ok.size===16){draw();setTimeout(()=>win(mv+' tries'),500);return}}else{lock=1;draw();setTimeout(()=>{open=[];lock=0;draw()},700);return}}
   draw()})};
 draw();
}
function echo(box){
 const col=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];let seq=[],pos=0,busy=1,tm=[];
 box.innerHTML='<div class="grid" style="grid-template-columns:1fr 1fr">'+col.map((c,i)=>'<button class="pad" data-i="'+i+'" style="background:'+c+';color:'+c+'" aria-label="pad '+(i+1)+'"></button>').join('')+'</div><div class="st" id="es">Watch the pattern.</div>';
 const pads=[...box.querySelectorAll('.pad')],es=document.getElementById('es');
 const flash=i=>{pads[i].classList.add('f');setTimeout(()=>pads[i].classList.remove('f'),350)};
 const play=()=>{busy=1;pos=0;es.textContent='Step '+seq.length+' of 7. Watch.';seq.forEach((s,k)=>setTimeout(()=>flash(s),700+k*650));setTimeout(()=>{busy=0;es.textContent='Your turn.'},700+seq.length*650)};
 const next=()=>{seq.push(rnd(4));play()};
 pads.forEach((p,i)=>p.onclick=()=>{if(busy)return;flash(i);
  if(i!==seq[pos]){busy=1;es.textContent='Wrong. Starting again.';seq=[];setTimeout(next,1100);return}
  pos++;if(pos===seq.length){if(seq.length===7){busy=1;setTimeout(()=>win('7 steps'),400)}else{busy=1;es.textContent='Good.';setTimeout(next,800)}}});
 setTimeout(next,600);
}
home();
const h=(location.hash||'').slice(1);
if(G[h]&&team){begin(h)}else if(G[h]){const b=app.querySelector('[data-g="'+h+'"]');if(b)b.style.outlineOffset='3px',b.style.outline='3px solid var(--c3)'}
</script>
</body>
</html>
